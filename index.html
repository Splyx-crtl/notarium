/* Vollständige Farbpalette: mehrere Helligkeitsstufen pro Farbton + Graustufen + freier Farbwähler */
function buildPalette(){
  const neutrals=['#000000','#1C2333','#333B4D','#5A6478','#9AA3B5','#D9CFB8','#FFFFFF'];
  const hues=[0,18,32,45,70,100,140,165,185,205,225,255,280,305,330];
  const shades=[38,52,66];
  const colored=[];
  hues.forEach(h=>shades.forEach(l=>colored.push(`hsl(${h}, 68%, ${l}%)`)));
  return neutrals.concat(colored);
}
const FULL_PALETTE = buildPalette();
function paletteGrid(current,onPick){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:grid; grid-template-columns:repeat(10,1fr); gap:5px; max-height:150px; overflow-y:auto; margin-bottom:8px; padding:2px;';
  function isSel(c){ return c.toLowerCase()===String(current).toLowerCase(); }
  function draw(){
    wrap.innerHTML='';
    FULL_PALETTE.forEach(c=>{
      const d=document.createElement('div'); d.className='color-dot'+(isSel(c)?' selected':''); d.style.background=c; d.style.width='18px'; d.style.height='18px';
      d.onclick=()=>{ current=c; onPick(c); draw(); };
      wrap.appendChild(d);
    });
    (STATE.recentColors||[]).forEach(c=>{
      const d=document.createElement('div'); d.className='color-dot'+(isSel(c)?' selected':''); d.style.background=c; d.style.width='18px'; d.style.height='18px'; d.style.borderStyle='dashed';
      d.onclick=()=>{ current=c; onPick(c); draw(); };
      wrap.appendChild(d);
    });
    const customBtn=document.createElement('div');
    customBtn.style.cssText='width:18px;height:18px;border-radius:50%;cursor:pointer;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:2px solid var(--border-soft);display:flex;align-items:center;justify-content:center;';
    customBtn.title='Beliebige Farbe wählen';
    const inp=document.createElement('input'); inp.type='color'; inp.style.cssText='opacity:0;position:absolute;width:1px;height:1px;';
    inp.value = String(current).startsWith('#') ? current : '#16233D';

      const c=ev.target.value; current=c; onPick(c);
      STATE.recentColors=[c,...(STATE.recentColors||[]).filter(x=>x!==c)].slice(0,10); queueSave();

    };

  }
  draw();

}

  pop.style.maxHeight='420px'; pop.style.overflowY='auto';
  const r=btn.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(r.left,innerWidth-280))+'px';

function exportCurrentPagePNG(){
  const page=STATE.pages[EDITOR.pageId];
  if(!page) return;
  try{
    const c=renderPageToOffscreen(page,2);
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='Notarium-Seite.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Seite als PNG exportiert');
  }catch(err){ console.error(err); toast('PNG-Export fehlgeschlagen.'); }
}
function duplicateSelected(){
  if(!EDITOR.selectedId || !STATE.pages[EDITOR.pageId]) return;
  const page=STATE.pages[EDITOR.pageId];
  const src=page.elements.find(e=>e.id===EDITOR.selectedId);
  if(!src) return;
  const copy=deepClone(src);
  copy.id=uid('el');
  if(copy.type==='stroke') copy.points=copy.points.map(p=>({...p,x:p.x+18,y:p.y+18}));
  else if(copy.type==='shape'){ copy.x1+=18; copy.x2+=18; copy.y1+=18; copy.y2+=18; }
  else { copy.x+=18; copy.y+=18; }
  page.elements.push(copy);
  EDITOR.selectedId=copy.id;
  pushHistory(); renderCanvas(); drawSelectionOverlay();
  toast('Element dupliziert');
}
function selectAdjacentPage(delta){
  const nb=STATE.nodes[NAV.notebookId]; if(!nb) return;
  const i=nb.pageOrder.indexOf(EDITOR.pageId);
  const next=clamp(i+delta,0,nb.pageOrder.length-1);
  if(next!==i) openPage(nb.pageOrder[next]);
}

/* ---------------------------- Backup, Hilfe & Info ---------------------------- */
function exportBackup(){
  try{
    const data=JSON.stringify(STATE,null,0);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url; a.download=`notarium-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('Backup wird heruntergeladen…');
  }catch(err){ console.error(err); toast('Backup konnte nicht erstellt werden.'); }
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=(ev)=>{
    let data;
    try{ data=JSON.parse(ev.target.result); }
    catch(err){ toast('Diese Datei ist kein gültiges Notarium-Backup.'); return; }
    if(!data || typeof data!=='object' || !data.nodes || !data.pages){
      toast('Diese Datei ist kein gültiges Notarium-Backup.'); return;
    }
    openModal(`<h3>Backup wiederherstellen</h3>
      <p style="font-size:13.5px; color:var(--text-muted); line-height:1.5;">
      Dadurch werden <b>alle aktuellen Notizbücher auf diesem Gerät ersetzt</b> durch den Inhalt der Backup-Datei.
      Dieser Schritt kann nicht rückgängig gemacht werden.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="bk-cancel">Abbrechen</button>
        <button class="btn btn-danger" id="bk-ok">Ersetzen &amp; wiederherstellen</button>
      </div>`);
    document.getElementById('bk-cancel').onclick=closeModal;
    document.getElementById('bk-ok').onclick=async ()=>{
      STATE=data;
      if(!STATE.recentColors) STATE.recentColors=[];
      await dbSet('state',STATE);
      closeModal();
      NAV.folderId=null; NAV.notebookId=null; NAV.pageId=null;
      showView('library');
      renderSidebarTree(); renderLibrary(); renderCrumbs();
      toast('Backup wiederhergestellt.');
    };
  };
  reader.readAsText(file);
}

  STATE.seeded=true;
  const nbId=createNotebook('Willkommen bei Notarium', null, COVER_COLORS[1]);

function wireGlobalUI(){
  document.getElementById('btn-new-notebook').onclick=openNewNotebookModal;
  document.getElementById('btn-new-folder').onclick=openNewFolderModal;
  document.getElementById('brand-toggle').onclick=()=>openFolder(null);
  document.getElementById('btn-collapse').onclick=()=>document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('btn-theme').onclick=()=>{
    STATE.theme = STATE.theme==='dark' ? 'light':'dark';
    document.body.dataset.theme=STATE.theme; queueSave();
  };
  document.getElementById('btn-more').onclick=(e)=>{
    openCtxMenu(e.clientX, e.clientY-190, [
      {label:'Backup speichern (.json)', action:exportBackup},
      {label:'Backup wiederherstellen…', action:()=>document.getElementById('file-backup').click()},
      'sep',
      {label:'Tastenkürzel', action:openShortcutsModal},
      {label:'Über Notarium', action:openAboutModal}
    ]);
  };
  document.getElementById('btn-mobile-menu').onclick=()=>{
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('mobile-backdrop').classList.toggle('show');
  };
  document.getElementById('mobile-backdrop').onclick=()=>{
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('mobile-backdrop').classList.remove('show');
  };
  document.getElementById('search-input').addEventListener('input',()=>{
    NAV.folderId=null;
    showView('library');
    renderLibrary();
    renderCrumbs();
  });

  // Datei-Importe
  document.getElementById('file-image').onchange=(e)=>{
    const f=e.target.files[0]; if(f) importImageFile(f); e.target.value='';
  };
  document.getElementById('file-pdf').onchange=(e)=>{
    const f=e.target.files[0]; if(f) importPDFFile(f); e.target.value='';
  };
  document.getElementById('file-backup').onchange=(e)=>{
    const f=e.target.files[0]; if(f) importBackupFile(f); e.target.value='';
  };
  document.getElementById('canvas-wrap').addEventListener('dragover',(e)=>e.preventDefault());
  document.getElementById('canvas-wrap').addEventListener('drop',(e)=>{
    e.preventDefault(); if(NAV.view!=='editor') return;
    const file=e.dataTransfer.files && e.dataTransfer.files[0]; if(!file) return;
    if(file.type==='application/pdf') importPDFFile(file);
    else if(file.type.startsWith('image/')) importImageFile(file, getLogicalPoint(e));
  });

  // Canvas Pointer-Events
  const canvas=document.getElementById('page-canvas');
  canvas.addEventListener('pointerdown',onCanvasPointerDown);
  canvas.addEventListener('pointermove',onCanvasPointerMove);
  canvas.addEventListener('pointerup',onCanvasPointerUp);
  canvas.addEventListener('pointercancel',onCanvasPointerUp);

  // Zoom per Strg+Mausrad
  document.getElementById('canvas-wrap').addEventListener('wheel',(e)=>{
    if(!e.ctrlKey || NAV.view!=='editor') return;
    e.preventDefault(); setZoom(EDITOR.zoom + (e.deltaY<0?0.1:-0.1));
  },{passive:false});

  // Tastenkombinationen
  window.addEventListener('keydown',(e)=>{
    const tag=(document.activeElement && document.activeElement.tagName)||'';
    const isEditingText = document.activeElement && document.activeElement.isContentEditable;
    const isTyping = tag==='INPUT' || tag==='TEXTAREA' || isEditingText;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey && !isTyping && NAV.view==='editor'){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z'&&e.shiftKey)) && !isTyping && NAV.view==='editor'){ e.preventDefault(); redo(); }
    else if((e.key==='Delete'||e.key==='Backspace') && !isTyping && NAV.view==='editor' && EDITOR.selectedId){ e.preventDefault(); deleteSelected(); }
    else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s' && !isTyping && NAV.view==='editor'){
      e.preventDefault(); dbSet('state',STATE).then(()=>setSaveIndicator('Gespeichert','#2E9E8B')).catch(()=>{});
    }
    else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='d' && !isTyping && NAV.view==='editor'){
      e.preventDefault(); duplicateSelected();
    }
    else if(!isTyping && NAV.view==='editor' && e.key==='PageDown'){ e.preventDefault(); selectAdjacentPage(1); }
    else if(!isTyping && NAV.view==='editor' && e.key==='PageUp'){ e.preventDefault(); selectAdjacentPage(-1); }
    else if(!isTyping && NAV.view==='editor'){
      const shortcuts={v:'select',p:'pen',h:'highlighter',e:'eraser',s:'shape',t:'text',i:'image'};
      const key=e.key.toLowerCase();
      if(shortcuts[key]){ setTool(shortcuts[key]); }
    }
    else if(e.key==='Escape'){
      EDITOR.selectedId=null; clearSelectionOverlay(); closeModal(); closeCtxMenu();
      document.getElementById('mobile-backdrop')?.classList.remove('show');
      document.getElementById('sidebar')?.classList.remove('mobile-open');
    }
  });

  window.addEventListener('resize',()=>{
    document.getElementById('btn-mobile-menu').style.display = innerWidth<=820?'flex':'none';
  });
  document.getElementById('btn-mobile-menu').style.display = innerWidth<=820?'flex':'none';

  window.addEventListener('beforeunload',()=>{ if(STATE){ dbSet('state',STATE).catch(()=>{}); } });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && STATE){ try{ dbSet('state',STATE); }catch(e){} } });
}

async function init(){
  try{
    const saved=await dbGet('state');
    STATE = saved || defaultState();
  }catch(err){
    console.error('IndexedDB nicht verfügbar, starte ohne dauerhafte Speicherung:', err);
    STATE = defaultState();
    setTimeout(()=>toast('Hinweis: Speichern ist in diesem Modus (z. B. privates Fenster) evtl. eingeschränkt.'),1200);
  }
  if(!STATE.nodes || !STATE.pages) STATE=defaultState();
  if(!Array.isArray(STATE.rootOrder)) STATE.rootOrder=[];
  if(!STATE.recentColors) STATE.recentColors=[];
  Object.values(STATE.nodes).forEach(n=>{ if(n.favorite==null) n.favorite=false; });
  seedIfEmpty();
  document.body.dataset.theme = STATE.theme||'light';
  buildToolbar();
  wireGlobalUI();
  renderSidebarTree();
  openFolder(null);
}
init();

if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline-Unterstützung optional, App funktioniert auch ohne */ });
  });
}

   ============================================================ */
(() => {
  const isStylus = e => e && (
    e.pointerType === "pen" ||
    (typeof e.pointerType === "string" && e.pointerType.toLowerCase() === "pen")
  );

  const isCanvasLike = el => {
    if (!el) return false;
    return !!el.closest?.("#canvasWrap, #pageCanvas, canvas");
  };

  let pan = null;
  let activePen = null;

  function canvasEl() {
    return document.querySelector("#pageCanvas") ||
           document.querySelector("#canvasWrap canvas") ||
           document.querySelector("canvas");
  }

  function wrapEl() {
    return document.querySelector("#canvasWrap");
  }

  // Finger panning is deliberately handled outside the drawing code.
  // We only activate it when the selected pointer is a finger.
  document.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch") return;
    if (window.EDITOR && EDITOR.tool === "pan") return;
    if (!isCanvasLike(e.target)) return;

    const wrap = wrapEl();
    if (!wrap) return;

    pan = {
      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      sx: wrap.scrollLeft,
      sy: wrap.scrollTop
    };
    try { wrap.setPointerCapture(e.pointerId); } catch {}
  }, {capture: true, passive: false});

  document.addEventListener("pointermove", e => {
    if (!pan || e.pointerId !== pan.id) return;
    const wrap = wrapEl();
    if (!wrap) return;

    e.preventDefault();
    wrap.scrollLeft = pan.sx - (e.clientX - pan.x);
    wrap.scrollTop  = pan.sy - (e.clientY - pan.y);
  }, {capture: true, passive: false});

  const endPan = e => {
    if (pan && e.pointerId === pan.id) {
      try { wrapEl()?.releasePointerCapture(e.pointerId); } catch {}
      pan = null;
    }
  };
  document.addEventListener("pointerup", endPan, {capture: true});
  document.addEventListener("pointercancel", endPan, {capture: true});

  // Prevent the normal mouse/touch drawing handlers from treating a finger
  // as ink. This is especially important on Surface/iPad/Android tablets.
  document.addEventListener("pointerdown", e => {
    if (!isStylus(e)) return;
    activePen = e.pointerId;
  }, {capture: true});

  document.addEventListener("pointerup", e => {
    if (e.pointerId === activePen) activePen = null;
  }, {capture: true});

  // Make existing floating geometry instruments much easier to drag.
  // We use pointer events, so mouse, Apple Pencil, Surface Pen and S Pen
  // all work consistently.
  function installGeometryDragging() {
    const candidates = document.querySelectorAll(
      ".measure-tool, .ruler, .triangle, .protractor, " +
      "[data-tool='ruler'], [data-tool='triangle'], [data-tool='protractor'], " +
      "[data-tool='angle'], [id*='ruler'], [id*='triangle'], [id*='protractor']"
    );

    candidates.forEach(tool => {
      if (tool.dataset.notariumDragInstalled === "1") return;
      tool.dataset.notariumDragInstalled = "1";

      tool.style.touchAction = "none";

      let drag = null;

      const down = e => {
        // If an actual button/input inside the instrument was clicked,
        // preserve that control.
        if (e.target.closest("button, input, select, textarea")) return;

        e.preventDefault();
        e.stopPropagation();

        const rect = tool.getBoundingClientRect();
        drag = {
          id: e.pointerId,
          x: e.clientX,
          y: e.clientY,
          left: rect.left,
          top: rect.top
        };

        tool.classList.add("dragging");
        try { tool.setPointerCapture(e.pointerId); } catch {}
      };

      const move = e => {
        if (!drag || e.pointerId !== drag.id) return;
        e.preventDefault();

        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;

        // Prefer transform when the original tool already uses one.
        // Otherwise use left/top.
        tool.style.left = `${drag.left + dx}px`;
        tool.style.top = `${drag.top + dy}px`;
      };

      const up = e => {
        if (!drag || e.pointerId !== drag.id) return;
        try { tool.releasePointerCapture(e.pointerId); } catch {}
        drag = null;
        tool.classList.remove("dragging");
      };

      tool.addEventListener("pointerdown", down, {passive: false});
      tool.addEventListener("pointermove", move, {passive: false});
      tool.addEventListener("pointerup", up);
      tool.addEventListener("pointercancel", up);
    });
  }

  installGeometryDragging();

  // Re-run after page/tool redraws.
  const observer = new MutationObserver(() => installGeometryDragging());
  observer.observe(document.body, {childList: true, subtree: true});
})();
</script>


<div id="tabletInputHint" style="display:none;position:fixed;left:50%;bottom:72px;
transform:translateX(-50%);z-index:9999;padding:9px 14px;border-radius:12px;
background:rgba(25,25,28,.92);color:#fff;font:500 13px system-ui;
box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:none;">
Finger: Blatt bewegen · Stift: Schreiben
</div>
<script>
(() => {
  const hint = document.getElementById("tabletInputHint");
  if (!hint) return;
  let timer;
  const show = () => {
    hint.style.display = "block";
    clearTimeout(timer);
    timer = setTimeout(() => hint.style.display = "none", 2200);
  };
  window.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || e.pointerType === "pen") show();
  }, {passive:true});
})();
</script>


<script id="notarium-ultimate-pack">
(() => {
  /* =========================================================
     NOTARIUM ULTIMATE PACK
     Themes, templates, planning, study tools, tags, quick actions
     ========================================================= */

  const U = {
    themeKey: 'notariumUltimateTheme',
    timer: { running:false, seconds:25*60, total:25*60, mode:'Fokus', interval:null },
    flash: { cards:[], index:0, show:false }
  };

  const ORIGINAL_DRAW_TEMPLATE = drawTemplate;
  const ORIGINAL_TPL_PREVIEW = tplPreviewSvg;

  /* ---------- Extended templates ---------- */
  const EXTRA_TEMPLATES = [
    {id:'dot-grid', label:'Punkt-Raster'},
    {id:'cornell', label:'Cornell Notes'},
    {id:'math', label:'Mathe'},
    {id:'weekly', label:'Wochenplan'},
    {id:'daily', label:'Tagesplan'},
    {id:'timetable', label:'Stundenplan'},
    {id:'checklist', label:'Checkliste'},
    {id:'meeting', label:'Meeting Notes'},
    {id:'journal', label:'Journal'},
    {id:'habit', label:'Habit Tracker'},
    {id:'music', label:'Notenblatt'}
  ];
  EXTRA_TEMPLATES.forEach(t => {
    if(!TEMPLATES.some(x => x.id === t.id)) TEMPLATES.push(t);
  });

  function gridStep(cmValue){ return cmValue * PX_PER_CM; }

  /* ---------- Rich template drawing ---------- */
  drawTemplate = function(ctx, template, paperColor, w, h){
    ORIGINAL_DRAW_TEMPLATE(ctx, template, paperColor, w, h);
    if(['dot-grid','cornell','math','weekly','daily','timetable','checklist','meeting','journal','habit','music'].indexOf(template)<0) return;

    const dark = isDarkColor(paperColor || '#fff');
    const ink = dark ? 'rgba(255,255,255,.28)' : 'rgba(35,45,65,.22)';
    const strong = dark ? 'rgba(255,255,255,.46)' : 'rgba(35,45,65,.38)';
    const accent = dark ? 'rgba(255,180,90,.55)' : 'rgba(194,72,58,.52)';
    const m = 1.5 * PX_PER_CM;
    const cm = gridStep;
    ctx.save();
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 1.1;

    if(template==='dot-grid'){
      for(let x=m;x<w-m;x+=cm(.5)) for(let y=m;y<h-m;y+=cm(.5)){
        ctx.beginPath(); ctx.arc(x,y,1.25,0,Math.PI*2); ctx.fill();
      }
    }
    if(template==='cornell'){
      const cue=5.5*PX_PER_CM, bottom=3.2*PX_PER_CM, line=0.85*PX_PER_CM;
      ctx.beginPath(); ctx.moveTo(m+cue,m); ctx.lineTo(m+cue,h-bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(m,h-bottom); ctx.lineTo(w-m,h-bottom); ctx.stroke();
      for(let y=m+line;y<h-bottom;y+=line){ ctx.beginPath(); ctx.moveTo(m+cue,y); ctx.lineTo(w-m,y); ctx.stroke(); }
      ctx.fillStyle=strong; ctx.font='600 13px Inter,sans-serif'; ctx.fillText('Cues',m+7,m+8);
      ctx.fillText('Notes',m+cue+8,m+8); ctx.fillText('Summary',m+7,h-bottom+9);
    }
    if(template==='math'){
      const step=cm(.5), darker=dark?'rgba(255,255,255,.22)':'rgba(40,60,100,.19)';
      ctx.strokeStyle=darker;
      for(let x=m;x<w-m;x+=step){ctx.beginPath();ctx.moveTo(x,m);ctx.lineTo(x,h-m);ctx.stroke();}
      for(let y=m;y<h-m;y+=step){ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();}
      ctx.strokeStyle=strong; ctx.lineWidth=1.6;
      for(let x=m;x<w-m;x+=cm(1)){ctx.beginPath();ctx.moveTo(x,m);ctx.lineTo(x,h-m);ctx.stroke();}
      for(let y=m;y<h-m;y+=cm(1)){ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();}
    }
    if(template==='weekly'){
      const top=2.6*PX_PER_CM, days=7, dayW=(w-2*m)/days;
      ctx.lineWidth=1.2;
      for(let i=0;i<=days;i++){let x=m+i*dayW;ctx.beginPath();ctx.moveTo(x,m);ctx.lineTo(x,h-m);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(m,m+top);ctx.lineTo(w-m,m+top);ctx.stroke();
      ctx.fillStyle=strong;ctx.font='600 12px Inter,sans-serif';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach((d,i)=>ctx.fillText(d,m+i*dayW+7,m+9));
      for(let y=m+top+cm(.8);y<h-m;y+=cm(.8)){ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();}
    }
    if(template==='daily'){
      const top=3.3*PX_PER_CM;
      ctx.strokeStyle=strong;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(m,top);ctx.lineTo(w-m,top);ctx.stroke();
      ctx.fillStyle=strong;ctx.font='600 14px Inter,sans-serif';
      ctx.fillText('Datum:',m, m+5); ctx.fillText('Prioritäten',m,m+top+8);
      for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(m+7,m+top+28+i*cm(.8),5,0,Math.PI*2);ctx.stroke();}
      for(let y=top+cm(.85);y<h-m;y+=cm(.85)){ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(m+20,y);ctx.lineTo(w-m,y);ctx.stroke();}
      ctx.strokeStyle=strong;ctx.beginPath();ctx.moveTo(w*0.64,top);ctx.lineTo(w*0.64,h-m);ctx.stroke();
      ctx.fillText('Notizen',w*0.64+10,m+top+10);
    }
    if(template==='timetable'){
      const left=2.3*PX_PER_CM, top=2.4*PX_PER_CM, cols=5, rows=8, cw=(w-left-m)/cols, rh=(h-top-m)/rows;
      ctx.strokeStyle=strong;ctx.lineWidth=1.2;
      for(let i=0;i<=cols;i++){let x=left+i*cw;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,h-m);ctx.stroke();}
      for(let i=0;i<=rows;i++){let y=top+i*rh;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-m,y);ctx.stroke();}
      ctx.fillStyle=strong;ctx.font='600 11px Inter,sans-serif';
      ['Mo','Di','Mi','Do','Fr'].forEach((d,i)=>ctx.fillText(d,left+i*cw+7,top+8));
      for(let i=0;i<rows;i++)ctx.fillText(String(1+i),m,top+i*rh+8);
    }
    if(template==='checklist'){
      const titleY=m+18, line=1.0*PX_PER_CM;
      ctx.fillStyle=strong;ctx.font='700 15px Inter,sans-serif';ctx.fillText('CHECKLIST',m,titleY);
      for(let y=titleY+cm(.9);y<h-m;y+=line){
        ctx.strokeStyle=strong;ctx.strokeRect(m,y-8,12,12);
        ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(m+24,y+1);ctx.lineTo(w-m,y+1);ctx.stroke();
      }
    }
    if(template==='meeting'){
      const head=3*PX_PER_CM;
      ctx.fillStyle=strong;ctx.font='600 13px Inter,sans-serif';
      ['Meeting:', 'Datum:', 'Teilnehmer:'].forEach((t,i)=>ctx.fillText(t,m+i*(w-2*m)/3,m+10));
      ctx.strokeStyle=strong;ctx.beginPath();ctx.moveTo(m,head);ctx.lineTo(w-m,head);ctx.stroke();
      ['Agenda','Notizen','Entscheidungen','Nächste Schritte'].forEach((t,i)=>{
        const y=head+cm(.9)+i*(cm(3.7));
        ctx.fillStyle=strong;ctx.font='600 13px Inter,sans-serif';ctx.fillText(t,m,y);
        ctx.strokeStyle=ink;
        for(let k=1;k<=3;k++){ctx.beginPath();ctx.moveTo(m,y+k*cm(.8));ctx.lineTo(w-m,y+k*cm(.8));ctx.stroke();}
      });
    }
    if(template==='journal'){
      ctx.fillStyle=strong;ctx.font='600 16px Inter,sans-serif';ctx.fillText('TODAY',m,m+18);
      ctx.fillStyle=ink;ctx.font='12px Inter,sans-serif';ctx.fillText('Mood / Gedanken / Highlights',m,m+36);
      for(let y=m+cm(2);y<h-m;y+=cm(.9)){ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();}
      ctx.strokeStyle=strong;ctx.beginPath();ctx.arc(w-m-30,m+30,18,0,Math.PI*2);ctx.stroke();
    }
    if(template==='habit'){
      const top=3*PX_PER_CM, cols=8, rows=10, left=4.3*PX_PER_CM, cw=(w-left-m)/cols, rh=(h-top-m)/rows;
      ctx.fillStyle=strong;ctx.font='700 14px Inter,sans-serif';ctx.fillText('HABIT TRACKER',m,m+17);
      ctx.strokeStyle=strong;ctx.lineWidth=1.1;
      for(let i=0;i<=cols;i++){let x=left+i*cw;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,h-m);ctx.stroke();}
      for(let i=0;i<=rows;i++){let y=top+i*rh;ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();}
      ctx.fillStyle=ink;ctx.font='9px Inter,sans-serif';['M','D','M','D','F','S','S'].forEach((d,i)=>ctx.fillText(d,left+i*cw+8,top-7));
    }
    if(template==='music'){
      const step=1.0*PX_PER_CM;
      for(let y=m+step;y<h-m;y+=step){
        ctx.strokeStyle=strong;ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();
      }
      ctx.strokeStyle=ink;
      for(let y=m+step;y<h-m;y+=cm(4.2)){
        ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(m,y);ctx.lineTo(w-m,y);ctx.stroke();
      }
    }
    ctx.restore();
  };

  tplPreviewSvg = function(tpl, color){
    if(!['dot-grid','cornell','math','weekly','daily','timetable','checklist','meeting','journal','habit','music'].includes(tpl))
      return ORIGINAL_TPL_PREVIEW(tpl,color);
    const base=`<rect width="60" height="80" fill="${color}"/>`;
    const stroke='#b9b19d';
    const txt='#64604f';
    if(tpl==='dot-grid') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}${Array.from({length:11}).map((_,i)=>Array.from({length:15}).map((_,j)=>`<circle cx="${5+i*5}" cy="${5+j*5}" r=".7" fill="${stroke}"/>`).join('')).join('')}</svg>`;
    if(tpl==='cornell') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}<line x1="18" y1="4" x2="18" y2="70" stroke="${stroke}"/><line x1="5" y1="70" x2="55" y2="70" stroke="${stroke}"/><text x="6" y="12" font-size="4" fill="${txt}">Cues</text><text x="22" y="12" font-size="4" fill="${txt}">Notes</text></svg>`;
    if(tpl==='math') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}${Array.from({length:12}).map((_,i)=>`<line x1="${5+i*5}" y1="4" x2="${5+i*5}" y2="76" stroke="${stroke}" stroke-width=".45"/>`).join('')}${Array.from({length:16}).map((_,i)=>`<line x1="5" y1="${4+i*5}" x2="55" y2="${4+i*5}" stroke="${stroke}" stroke-width=".45"/>`).join('')}</svg>`;
    if(tpl==='weekly') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}${Array.from({length:8}).map((_,i)=>`<line x1="${5+i*7.1}" y1="12" x2="${5+i*7.1}" y2="76" stroke="${stroke}"/>`).join('')}<line x1="5" y1="12" x2="55" y2="12" stroke="${stroke}"/></svg>`;
    if(tpl==='daily') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}<line x1="38" y1="12" x2="38" y2="76" stroke="${stroke}"/><line x1="5" y1="16" x2="55" y2="16" stroke="${stroke}"/><line x1="8" y1="22" x2="34" y2="22" stroke="${stroke}"/><line x1="8" y1="30" x2="34" y2="30" stroke="${stroke}"/><line x1="8" y1="38" x2="34" y2="38" stroke="${stroke}"/></svg>`;
    if(tpl==='timetable') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}${Array.from({length:6}).map((_,i)=>`<line x1="${12+i*8}" y1="10" x2="${12+i*8}" y2="75" stroke="${stroke}"/>`).join('')}${Array.from({length:9}).map((_,i)=>`<line x1="12" y1="${10+i*8}" x2="54" y2="${10+i*8}" stroke="${stroke}"/>`).join('')}</svg>`;
    if(tpl==='checklist') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}<text x="5" y="12" font-size="5" fill="${txt}">CHECKLIST</text>${[22,32,42,52,62,72].map(y=>`<rect x="5" y="${y-4}" width="3.5" height="3.5" fill="none" stroke="${stroke}"/><line x1="12" y1="${y-1}" x2="55" y2="${y-1}" stroke="${stroke}"/>`).join('')}</svg>`;
    if(tpl==='meeting') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}<line x1="5" y1="18" x2="55" y2="18" stroke="${stroke}"/>${[28,42,56,70].map(y=>`<line x1="5" y1="${y}" x2="55" y2="${y}" stroke="${stroke}"/>`).join('')}<text x="5" y="12" font-size="4" fill="${txt}">MEETING NOTES</text></svg>`;
    if(tpl==='journal') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}<text x="5" y="13" font-size="5" fill="${txt}">TODAY</text>${[24,34,44,54,64,74].map(y=>`<line x1="5" y1="${y}" x2="55" y2="${y}" stroke="${stroke}"/>`).join('')}</svg>`;
    if(tpl==='habit') return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}<text x="5" y="10" font-size="4.5" fill="${txt}">HABIT TRACKER</text>${Array.from({length:7}).map((_,i)=>`<line x1="${10+i*6}" y1="15" x2="${10+i*6}" y2="75" stroke="${stroke}"/>`).join('')}${Array.from({length:7}).map((_,i)=>`<line x1="10" y1="${15+i*9}" x2="52" y2="${15+i*9}" stroke="${stroke}"/>`).join('')}</svg>`;
    return `<svg viewBox="0 0 60 80" style="width:100%;height:100%">${base}${[24,29,34,39,58,63,68,73].map(y=>`<line x1="5" y1="${y}" x2="55" y2="${y}" stroke="${stroke}"/>`).join('')}</svg>`;
  };

  /* ---------- Themes ---------- */
  const THEMES = [
    {id:'classic',label:'Classic',bg:'#f7f5ef',surface:'#fffdf8',paper:'#f0ece1',ink:'#16233D',accent:'#D98E2B'},
    {id:'midnight',label:'Midnight',bg:'#0f1420',surface:'#171e2d',paper:'#232c40',ink:'#f1f4fa',accent:'#8fb7ff'},
    {id:'forest',label:'Forest',bg:'#eef4ee',surface:'#f8fcf8',paper:'#dfeadf',ink:'#203a2a',accent:'#5b9b73'},
    {id:'ocean',label:'Ocean',bg:'#eef6f8',surface:'#fbffff',paper:'#dcecef',ink:'#19344b',accent:'#438fa8'},
    {id:'lavender',label:'Lavender',bg:'#f5f1fb',surface:'#fffaff',paper:'#eae2f4',ink:'#34284d',accent:'#9272c5'},
    {id:'rose',label:'Rose',bg:'#fbf1f4',surface:'#fffafb',paper:'#f3dfe5',ink:'#4d2833',accent:'#bf7187'},
    {id:'mono',label:'Monochrome',bg:'#ededed',surface:'#fafafa',paper:'#dedede',ink:'#202020',accent:'#666666'}
  ];
  function applyTheme(id, persist=true){
    const t=THEMES.find(x=>x.id===id)||THEMES[0];
    let style=document.getElementById('ultimate-theme-style');
    if(!style){ style=document.createElement('style'); style.id='ultimate-theme-style'; document.head.appendChild(style); }
    style.textContent=`body{--bg-app:${t.bg};--bg-surface:${t.surface};--paper-200:${t.paper};--ink-800:${t.ink};--amber-500:${t.accent};--amber-600:${t.accent};--text-main:${t.ink};}`;
    document.body.dataset.ultimateTheme=id;
    if(persist) localStorage.setItem(U.themeKey,id);
  }

  /* ---------- Tags ---------- */
  function nodeTags(node){ return Array.isArray(node.tags)?node.tags:[]; }
  function saveTags(node, raw){
    node.tags = raw.split(',').map(s=>s.trim()).filter(Boolean).slice(0,12);
    queueSave(); renderSidebarTree(); renderLibrary();
    toast('Tags gespeichert');
  }
  function openTagEditor(node){
    openModal(`<h3>Tags bearbeiten</h3>
      <p style="font-size:12px;color:var(--text-muted)">Mehrere Tags mit Komma trennen.</p>
      <input id="tag-input" value="${escapeHtml(nodeTags(node).join(', '))}" placeholder="z. B. Mathe, Prüfung, Wichtig">
      <div class="modal-actions"><button class="btn btn-ghost" id="tag-cancel">Abbrechen</button><button class="btn btn-primary" id="tag-ok">Speichern</button></div>`);
    const inp=document.getElementById('tag-input'); inp.focus(); inp.select();
    document.getElementById('tag-cancel').onclick=closeModal;
    document.getElementById('tag-ok').onclick=()=>{saveTags(node,inp.value);closeModal();};
  }

  /* Extend notebook context menu */
  const _openNodeContextMenu = openNodeContextMenu;
  openNodeContextMenu = function(e,node){
    const items=[{label:'Umbenennen',action:()=>promptRename(node)}];
    if(node.type==='notebook'){
      items.push({label:node.favorite?'Favorit entfernen':'Als Favorit markieren',action:()=>{node.favorite=!node.favorite;queueSave();renderSidebarTree();renderLibrary();}});
      items.push({label:'Tags bearbeiten',action:()=>openTagEditor(node)});
      items.push({label:'Duplizieren',action:()=>{duplicateNotebook(node.id);renderSidebarTree();renderLibrary();toast('Notizbuch dupliziert');}});
      items.push({label:'Als PDF exportieren',action:()=>exportNotebookPDF(node.id)});
      items.push({label:'Cover & Design',action:()=>openNotebookDesign(node.id)});
    }
    items.push('sep');
    items.push({label:'Löschen',danger:true,action:()=>{

  function openPomodoro(){
    openModal(`<div class="ultimate-modal"><h3>⏱ Pomodoro</h3>
      <div class="study-timer" id="pomo-time">25:00</div>
      <div class="study-actions">
        <button class="btn btn-primary" id="pomo-start">Start</button>
        <button class="btn btn-ghost" id="pomo-reset">Reset</button>
        <button class="btn btn-ghost" id="pomo-15">15 min</button>
        <button class="btn btn-ghost" id="pomo-25">25 min</button>
        <button class="btn btn-ghost" id="pomo-50">50 min</button>
      </div>
      <p id="pomo-label" style="text-align:center;color:var(--text-muted);font-size:12px;margin:10px 0 0">Fokus</p>
      <div class="modal-actions"><button class="btn btn-ghost" id="pomo-close">Schließen</button></div></div>`);
    const display=document.getElementById('pomo-time'), label=document.getElementById('pomo-label'), start=document.getElementById('pomo-start');
    function draw(){
      const m=Math.floor(U.timer.seconds/60), sec=U.timer.seconds%60;
      display.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
      label.textContent=U.timer.mode;
      start.textContent=U.timer.running?'Pause':'Start';
    }
    function stop(){U.timer.running=false;clearInterval(U.timer.interval);U.timer.interval=null;draw();}
    function setMin(n){stop();U.timer.seconds=n*60;U.timer.total=n*60;U.timer.mode='Fokus';draw();}
    start.onclick=()=>{
      if(U.timer.running){stop();return;}
      U.timer.running=true;draw();
      U.timer.interval=setInterval(()=>{
        U.timer.seconds--;
        if(U.timer.seconds<=0){
          stop(); U.timer.mode='Pause'; U.timer.seconds=5*60; U.timer.total=5*60;
          toast('Pomodoro fertig – 5 Minuten Pause');
          try{new AudioContext().close()}catch{}
        }
        draw();
      },1000);
    };
    document.getElementById('pomo-reset').onclick=()=>setMin(25);
    document.getElementById('pomo-15').onclick=()=>setMin(15);
    document.getElementById('pomo-25').onclick=()=>setMin(25);
    document.getElementById('pomo-50').onclick=()=>setMin(50);
    document.getElementById('pomo-close').onclick=()=>{stop();closeModal();};
    setMin(25);
  }

  function buildCards(text){
    const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(x=>x.length>8);
    const cards=[];
    lines.forEach(line=>{
      const parts=line.split(/[:–—=]\s*/);
      if(parts.length>=2){
        cards.push({q:parts[0],a:parts.slice(1).join(': ')});
      }else if(line.includes('?')){
        cards.push({q:line,a:'Antwort aus deinen Notizen ergänzen.'});
      }
    });
    return cards.slice(0,60);
  }

  /* ---------- Patch search: include tags ---------- */
  const originalRenderLibrary = renderLibrary;
  renderLibrary = function(){
    const q=(document.getElementById('search-input')?.value||'').trim().toLowerCase();
    if(q){
      const grid=document.getElementById('library-grid');
      const matches=Object.values(STATE.nodes||{}).filter(n=>{
        if((n.name||'').toLowerCase().includes(q)) return true;
        if(nodeTags(n).some(t=>t.toLowerCase().includes(q))) return true;
        if(n.type==='notebook') return n.pageOrder.some(pid=>(STATE.pages[pid]?.elements||[]).some(el=>el.type==='text' && String(el.content||'').toLowerCase().includes(q)));
        return false;
      });
      const old=document.getElementById('search-input').value;
      document.getElementById('search-input').value='';
      originalRenderLibrary();
      document.getElementById('search-input').value=old;
      if(matches.length){
        grid.innerHTML='';
        matches.forEach(node=>{
          // Reuse minimal rendering by jumping to parent then leaving the main renderer intact.
          const card=document.createElement('div');card.className='card'+(node.favorite?' favorite':'');card.dataset.id=node.id;
          const thumb=node.type==='folder'?`<div class="card-thumb folder-thumb">${ICO.folder}</div>`:`<div class="card-thumb" style="background:${node.cover||'#16233D'}"><div style="font-size:18px;color:#fff;font-weight:800;padding:14px">${escapeHtml(node.name.slice(0,20))}</div></div>`;
          card.innerHTML=thumb+`<div class="card-name">${escapeHtml(node.name)}</div><div class="card-meta">${node.type==='folder'?'Ordner':'Notizbuch'}${nodeTags(node).length?' · '+escapeHtml(nodeTags(node).join(' · ')):''}</div>`;
          card.onclick=()=>node.type==='folder'?openFolder(node.id):openNotebook(node.id);
          grid.appendChild(card);
        });
      }
      return;
    }
    originalRenderLibrary();
  };

  /* ---------- Theme persistence ---------- */
  function loadTheme(){
    const saved=localStorage.getItem(U.themeKey);
    if(saved) applyTheme(saved,false);
  }

  /* ---------- Hook extras button ---------- */
  function hook(){
    loadTheme();
    const b=document.getElementById('btn-extras');
    if(b) b.onclick=openUltimateHub;
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hook);
  else hook();
})();
</script>


<script id="notarium-modern-hud-js">
(() => {
  /* ---------- Small quality-of-life helpers ---------- */
  function safeCall(fnName,...args){
    try{ if(typeof window[fnName]==='function') return window[fnName](...args); }catch(e){}
  }

  /* Command palette */
  const palette=document.createElement('div');
  palette.id='notarium-command-palette';
  palette.innerHTML=`
    <div class="ncp-window">
      <div class="ncp-head"><input id="ncp-input" placeholder="Befehl suchen …  z. B. Template, Pomodoro, Export"></div>
      <div class="ncp-list" id="ncp-list"></div>
      <div class="ncp-foot">↑ ↓ auswählen · Enter öffnen · Esc schließen · Ctrl/⌘ K</div>
    </div>`;
  document.body.appendChild(palette);

  const commands=[
    ['✨','Extras','Designs, Templates, Lernen und Tools öffnen',()=>safeCall('openUltimateHub')],
    ['🎨','Designs','Notarium-Theme auswählen',()=>{safeCall('openUltimateHub');}],
    ['📄','Templates','Template-Galerie öffnen',()=>safeCall('openTemplateGallery')],
    ['🧠','Lernstudio','Lernfunktionen öffnen',()=>safeCall('openStudyHub')],
    ['⏱','Pomodoro','Fokus-Timer starten',()=>safeCall('openPomodoro')],
    ['🃏','Karteikarten','Karteikarten öffnen',()=>safeCall('openFlashcardsFromNotes')],
    ['🔤','Vokabeltrainer','Vokabeltraining öffnen',()=>safeCall('openVocab')],
    ['📚','Zusammenfassung','Notizen strukturieren',()=>safeCall('openSummary')],
    ['💾','Backup','Komplettes Backup exportieren',()=>safeCall('exportBackup')],
    ['📊','Statistik','Bibliotheksstatistik anzeigen',()=>{const s=typeof countStats==='function'?countStats():null;if(s)toast(`${s.notebooks} Notizbücher · ${s.pages} Seiten · ${s.text} Texte · ${s.strokes} Zeichnungen`);}],
    ['⌨️','Shortcuts','Tastenkürzel anzeigen',()=>safeCall('openShortcutsModal')],
    ['✋','Blatt bewegen','Blatt-Modus aktivieren',()=>safeCall('setTool','pan')],
    ['✏️','Stift','Stift aktivieren',()=>safeCall('setTool','pen')],
    ['🖍','Textmarker','Textmarker aktivieren',()=>safeCall('setTool','highlighter')],
    ['⌫','Radierer','Radierer aktivieren',()=>safeCall('setTool','eraser')],
  ];
  let sel=0;
  function renderCommands(q=''){
    const query=q.trim().toLowerCase();
    const arr=commands.filter(c=>(c[1]+' '+c[2]).toLowerCase().includes(query));
    if(sel>=arr.length)sel=0;
    document.getElementById('ncp-list').innerHTML=arr.map((c,i)=>`
      <div class="ncp-item ${i===sel?'selected':''}" data-cmd="${i}">
        <div class="ncp-icon">${c[0]}</div><div><strong>${c[1]}</strong><span>${c[2]}</span></div>
      </div>`).join('') || `<div style="padding:18px;color:#77808c;font-size:12px">Kein Befehl gefunden.</div>`;
    document.querySelectorAll('.ncp-item').forEach((el,i)=>el.onclick=()=>{
      const c=arr[i]; closePalette(); if(c) c[3]();
    });
  }
  function openPalette(){sel=0;palette.classList.add('show');const i=document.getElementById('ncp-input');i.value='';renderCommands();setTimeout(()=>i.focus(),20)}
  function closePalette(){palette.classList.remove('show')}
  window.openNotariumCommandPalette=openPalette;
  document.getElementById('ncp-input').addEventListener('input',e=>{sel=0;renderCommands(e.target.value)});
  document.getElementById('ncp-input').addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel++;renderCommands(e.target.value)}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);renderCommands(e.target.value)}
    if(e.key==='Enter'){
      const query=e.target.value.trim().toLowerCase();
      const arr=commands.filter(c=>(c[1]+' '+c[2]).toLowerCase().includes(query));
      if(arr[sel]){closePalette();arr[sel][3]();}
    }
    if(e.key==='Escape')closePalette();
  });
  palette.addEventListener('click',e=>{if(e.target===palette)closePalette()});
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  });

  /* Bottom floating quick bar */
  const bottom=document.createElement('div');
  bottom.id='notarium-bottom-bar';
  bottom.innerHTML=`
    <button id="nb-pen" title="Stift">✏️</button>
    <button id="nb-highlight" title="Textmarker">🖍️</button>
    <button id="nb-eraser" title="Radierer">⌫</button>
    <button id="nb-pan" title="Blatt bewegen">✋</button>
    <span class="hud-sep"></span>
    <button id="nb-undo" title="Rückgängig">↶</button>
    <button id="nb-redo" title="Wiederholen">↷</button>
    <span class="hud-sep"></span>
    <button id="nb-template" title="Templates">📄</button>
    <button id="nb-study" title="Lernstudio">🧠</button>
    <button id="nb-command" title="Befehle (Ctrl+K)">⌘</button>`;
  document.body.appendChild(bottom);
  const bind=(id,fn)=>document.getElementById(id).addEventListener('click',fn);
  bind('nb-pen',()=>safeCall('setTool','pen'));
  bind('nb-highlight',()=>safeCall('setTool','highlighter'));
  bind('nb-eraser',()=>safeCall('setTool','eraser'));
  bind('nb-pan',()=>safeCall('setTool','pan'));
  bind('nb-undo',()=>document.execCommand('undo'));
  bind('nb-redo',()=>document.execCommand('redo'));
  bind('nb-template',()=>safeCall('openTemplateGallery'));
  bind('nb-study',()=>safeCall('openStudyHub'));
  bind('nb-command',openPalette);

  /* Replace/augment extras button behavior */
  const extras=document.getElementById('btn-extras');
  if(extras){
    extras.innerHTML='✨';
    extras.title='Notarium Center · Ctrl+K';
    extras.onclick=()=>safeCall('openUltimateHub');
  }

  /* Add an unobtrusive top status area */
  const bar=document.querySelector('.topbar');
  if(bar && !document.getElementById('notarium-status')){
    const s=document.createElement('div');
    s.id='notarium-status';
    s.className='np-status';
    s.innerHTML='<span class="np-dot"></span><span>Autosave</span>';
    const spacer=bar.querySelector('.topbar-spacer');
    if(spacer) spacer.before(s);
    else bar.appendChild(s);
  }

  /* Escape should always close modal/palette where appropriate */
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && palette.classList.contains('show')) closePalette();
  });

  /* Improve visible tooltips for icon-heavy HUD */
  document.querySelectorAll('.icon-btn,.tool-btn').forEach(b=>{
    if(!b.getAttribute('title') && b.getAttribute('aria-label')) b.setAttribute('title',b.getAttribute('aria-label'));
  });
})();
</script>

<script id="notarium-premium-upgrade-js">
(() => {
  'use strict';

  const P = {
    filter: 'all',
    sort: 'manual',
    trashOpen: false
  };

  const esc = s => typeof escapeHtml === 'function' ? escapeHtml(String(s ?? '')) :
    String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function ensureState(){
    if(!window.STATE) return;
    if(!Array.isArray(STATE.trash)) STATE.trash=[];
    Object.values(STATE.nodes||{}).forEach(n=>{
      if(!Array.isArray(n.tags)) n.tags=[];
      if(typeof n.favorite!=='boolean') n.favorite=false;
      if(!n.updatedAt) n.updatedAt=n.createdAt||Date.now();
    });
  }

  function touch(node){
    if(node) node.updatedAt=Date.now();
  }

  /* ---------- Safe trash implementation ---------- */
  function snapshotTree(rootId){
    const root=STATE.nodes[rootId];
    if(!root) return null;
    const nodes={},pages={};

    function walk(id){
      const n=STATE.nodes[id];
      if(!n) return;
      nodes[id]=deepClone(n);
      if(n.type==='notebook'){
        (n.pageOrder||[]).forEach(pid=>{
          if(STATE.pages[pid]) pages[pid]=deepClone(STATE.pages[pid]);
        });
      }
      if(n.type==='folder'){
        Object.values(STATE.nodes).filter(x=>x.parentId===id).forEach(x=>walk(x.id));
      }
    }
    walk(rootId);
    return {
      rootId,
      name:root.name,
      type:root.type,
      deletedAt:Date.now(),
      nodes,
      pages
    };
  }

  function hardRemoveTree(rootId){
    const root=STATE.nodes[rootId];
    if(!root) return;
    const ids=[];
    const walk=id=>{
      const n=STATE.nodes[id]; if(!n) return;
      ids.push(id);
      if(n.type==='folder'){
        Object.values(STATE.nodes).filter(x=>x.parentId===id).forEach(x=>walk(x.id));
      }
    };
    walk(rootId);
    ids.forEach(id=>{
      const n=STATE.nodes[id];
      if(n?.type==='notebook') (n.pageOrder||[]).forEach(pid=>delete STATE.pages[pid]);
    });
    ids.forEach(id=>delete STATE.nodes[id]);
    STATE.rootOrder=(STATE.rootOrder||[]).filter(id=>!ids.includes(id));
  }

  window.deleteNodeRecursive = function(id){
    ensureState();
    const snap=snapshotTree(id);
    if(!snap) return;
    hardRemoveTree(id);
    STATE.trash.unshift(snap);
    queueSave();
    if(NAV.folderId===id){NAV.folderId=null;showView('library');}
    if(NAV.notebookId===id){NAV.notebookId=null;NAV.pageId=null;showView('library');}
    renderSidebarTree();renderLibrary();renderCrumbs();
    updateTrashBadge();
    toast('In den Papierkorb verschoben');
  };

  function restoreItem(index){
    const item=STATE.trash[index]; if(!item) return;
    Object.values(item.nodes).forEach(n=>{
      const copy=deepClone(n);
      if(copy.id===item.rootId && copy.parentId && !STATE.nodes[copy.parentId]) copy.parentId=null;
      STATE.nodes[copy.id]=copy;
    });
    Object.values(item.pages).forEach(p=>STATE.pages[p.id]=deepClone(p));

    const root=STATE.nodes[item.rootId];
    if(root.parentId && STATE.nodes[root.parentId]){
      root.order=nextOrder(root.parentId);
    }else{
      root.parentId=null;
      root.order=STATE.rootOrder.length
        ? Math.max(...STATE.rootOrder.map(id=>STATE.nodes[id]?.order??0))+1 : 0;
      if(!STATE.rootOrder.includes(root.id)) STATE.rootOrder.push(root.id);
    }

    STATE.trash.splice(index,1);
    queueSave();updateTrashBadge();
    P.trashOpen=false;
    renderSidebarTree();renderLibrary();renderCrumbs();
    toast('Wiederhergestellt');
  }

  function deleteTrashItem(index){
    const item=STATE.trash[index]; if(!item) return;
    if(!confirm(`„${item.name}“ endgültig löschen?\n\nDieser Vorgang kann nicht rückgängig gemacht werden.`)) return;
    STATE.trash.splice(index,1);
    queueSave();renderTrash();updateTrashBadge();
    toast('Endgültig gelöscht');
  }

  function emptyTrash(){
    if(!STATE.trash.length) return;
    if(!confirm('Den gesamten Papierkorb endgültig leeren?')) return;
    STATE.trash=[];queueSave();renderTrash();updateTrashBadge();toast('Papierkorb geleert');
  }

  function updateTrashBadge(){
    const btn=document.getElementById('premium-trash-button');
    if(!btn) return;
    let badge=btn.querySelector('.premium-trash-count');
    if(!badge){
      badge=document.createElement('span');
      badge.className='premium-trash-count';
      badge.style.cssText='position:absolute;right:1px;top:1px;min-width:15px;height:15px;border-radius:99px;background:var(--amber-500);color:var(--ink-900);font-size:9px;font-weight:800;display:grid;place-items:center';
      btn.appendChild(badge);
    }
    const n=STATE?.trash?.length||0;
    badge.textContent=n>99?'99+':n;
    badge.style.display=n?'grid':'none';
  }

  function renderTrash(){
    ensureState();
    const grid=document.getElementById('library-grid');
    const heading=document.getElementById('library-heading');
    if(!grid||!heading) return;

    P.trashOpen=true;
    heading.textContent='Papierkorb';
    grid.innerHTML='';

    document.querySelector('.premium-trash-actions')?.remove();
    const wrap=document.querySelector('#view-library .grid-wrap');

    const actions=document.createElement('div');
    actions.className='library-tools premium-toolbar premium-trash-actions';
    actions.innerHTML=`<span class="premium-count">🗑️ ${STATE.trash.length} Einträge</span>
      <span class="premium-spacer"></span>
      <button class="filter-btn" id="premium-trash-empty">Papierkorb leeren</button>`;
    wrap.insertBefore(actions,grid);
    actions.querySelector('#premium-trash-empty').onclick=emptyTrash;

    if(!STATE.trash.length){
      grid.innerHTML=`<div class="premium-trash-empty"><div class="big">🗑️</div>
        <h3 style="color:var(--text-main);margin:0 0 5px">Papierkorb ist leer</h3>
        <div>Gelöschte Notizbücher und Ordner werden hier vorübergehend aufbewahrt.</div></div>`;
      return;
    }

    STATE.trash.forEach((item,i)=>{
      const card=document.createElement('div');
      card.className='card premium-trash-card';
      card.innerHTML=`<div class="card-thumb"><div style="font-size:34px">🗑️</div></div>
        <button class="premium-trash-delete" title="Endgültig löschen">×</button>
        <button class="premium-restore">↩ Wiederherstellen</button>
        <div class="card-name">${esc(item.name)}</div>
        <div class="card-meta">${item.type==='folder'?'Ordner':'Notizbuch'} · ${new Date(item.deletedAt).toLocaleDateString('de-DE')}</div>`;
      card.querySelector('.premium-restore').onclick=e=>{e.stopPropagation();restoreItem(i)};
      card.querySelector('.premium-trash-delete').onclick=e=>{e.stopPropagation();deleteTrashItem(i)};
      grid.appendChild(card);
    });
  }

  /* ---------- Library toolbar ---------- */
  function ensureLibraryToolbar(){
    const wrap=document.querySelector('#view-library .grid-wrap');
    const heading=document.getElementById('library-heading');
    if(!wrap||!heading||wrap.querySelector('.premium-toolbar:not(.premium-trash-actions)')) return;

    const bar=document.createElement('div');
    bar.className='library-tools premium-toolbar';
    bar.innerHTML=`<button class="filter-btn active" data-premium-filter="all">Alle</button>
      <button class="filter-btn" data-premium-filter="favorites">⭐ Favoriten</button>
      <button class="filter-btn" data-premium-filter="recent">🕘 Zuletzt</button>
      <button class="filter-btn" data-premium-filter="tagged">🏷️ Getaggt</button>
      <span class="premium-spacer"></span>
      <select id="premium-sort" aria-label="Sortierung">
        <option value="manual">Manuelle Reihenfolge</option>
        <option value="name">Name A–Z</option>
        <option value="newest">Zuletzt geändert</option>
        <option value="favorites">Favoriten zuerst</option>
      </select>
      <span class="premium-count" id="premium-visible-count"></span>`;
    heading.insertAdjacentElement('afterend',bar);

    bar.querySelectorAll('[data-premium-filter]').forEach(btn=>{
      btn.onclick=()=>{
        P.filter=btn.dataset.premiumFilter;
        P.trashOpen=false;
        bar.querySelectorAll('[data-premium-filter]').forEach(x=>x.classList.toggle('active',x===btn));
        renderLibrary();
      };
    });
    bar.querySelector('#premium-sort').onchange=e=>{
      P.sort=e.target.value;renderLibrary();
    };
  }

  function updateLibraryCards(){
    const grid=document.getElementById('library-grid');
    if(!grid || NAV.view!=='library' || P.trashOpen) return;
    const cards=[...grid.querySelectorAll('.card[data-id]')];
    const nodes=Object.fromEntries(Object.values(STATE.nodes||{}).map(n=>[n.id,n]));

    let visible=0;
    cards.forEach(card=>{
      const n=nodes[card.dataset.id]; if(!n){card.style.display='none';return;}
      let show=true;
      if(P.filter==='favorites') show=!!n.favorite;
      if(P.filter==='tagged') show=Array.isArray(n.tags)&&n.tags.length>0;
      if(P.filter==='recent'){
        const age=Date.now()-(n.updatedAt||n.createdAt||0);
        show=age<=1000*60*60*24*30;
      }
      card.style.display=show?'':'none';
      if(show) visible++;

      if(n.type==='notebook'){
        let info=card.querySelector('.premium-card-info');
        if(!info){
          info=document.createElement('div');
          info.className='premium-card-info';
          card.appendChild(info);
        }
        const tags=(n.tags||[]).slice(0,3).map(t=>`<span class="premium-tag">#${esc(t)}</span>`).join('');
        const changed=n.updatedAt||n.createdAt;
        info.innerHTML=tags+(changed?`<span class="premium-updated">${new Date(changed).toLocaleDateString('de-DE')}</span>`:'');
      }
    });

    if(P.sort!=='manual'){
      const sorted=cards.slice().sort((a,b)=>{
        const A=nodes[a.dataset.id],B=nodes[b.dataset.id];
        if(P.sort==='name') return String(A?.name||'').localeCompare(String(B?.name||''),'de');
        if(P.sort==='newest') return (B?.updatedAt||B?.createdAt||0)-(A?.updatedAt||A?.createdAt||0);
        if(P.sort==='favorites') return Number(!!B?.favorite)-Number(!!A?.favorite) ||
          String(A?.name||'').localeCompare(String(B?.name||''),'de');
        return 0;
      });
      sorted.forEach(c=>grid.appendChild(c));
    }
    const count=document.getElementById('premium-visible-count');
    if(count) count.textContent=`${visible} sichtbar`;
  }

  const originalRenderLibrary=window.renderLibrary;
  if(typeof originalRenderLibrary==='function'){
    window.renderLibrary=function(){
      ensureState();
      ensureLibraryToolbar();
      originalRenderLibrary();
      updateLibraryCards();
      updateTrashBadge();
    };
  }

  /* ---------- Dashboard ---------- */
  function addDashboard(){
    const wrap=document.querySelector('#view-library .grid-wrap');
    const heading=document.getElementById('library-heading');
    if(!wrap||!heading||document.getElementById('premium-dashboard')) return;

    const d=document.createElement('div');
    d.id='premium-dashboard';
    d.innerHTML=`<div class="premium-stat"><b id="ps-books">0</b><span>Notizbücher</span></div>
      <div class="premium-stat"><b id="ps-pages">0</b><span>Seiten</span></div>
      <div class="premium-stat"><b id="ps-favs">0</b><span>Favoriten</span></div>
      <div class="premium-stat"><b id="ps-tags">0</b><span>Tags</span></div>`;
    heading.insertAdjacentElement('afterend',d);

    const q=document.createElement('div');
    q.id='premium-quick-create';
    q.innerHTML=`<button id="pq-notebook">＋ Notizbuch</button>
      <button id="pq-folder">＋ Ordner</button>
      <button id="pq-backup">💾 Backup</button>
      <button id="pq-extras">✨ Extras</button>`;
    d.insertAdjacentElement('afterend',q);
    document.getElementById('pq-notebook').onclick=()=>openNewNotebookModal();
    document.getElementById('pq-folder').onclick=()=>openNewFolderModal();
    document.getElementById('pq-backup').onclick=()=>exportBackup();
    document.getElementById('pq-extras').onclick=()=>openUltimateHub();
  }

  function updateDashboard(){
    const d=document.getElementById('premium-dashboard');
    if(!d||!window.STATE) return;
    const nodes=Object.values(STATE.nodes||{});
    const pages=Object.values(STATE.pages||{});
    const books=nodes.filter(n=>n.type==='notebook');
    const favs=books.filter(n=>n.favorite).length;
    const tags=new Set(books.flatMap(n=>n.tags||[])).size;
    const put=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
    put('ps-books',books.length);put('ps-pages',pages.length);put('ps-favs',favs);put('ps-tags',tags);
  }

  /* ---------- Better data center ---------- */
  function enhanceDataPane(){
    const pane=document.getElementById('pane-data');
    if(!pane||pane.querySelector('.premium-data-box')) return;
    const box=document.createElement('div');
    box.className='premium-data-box';
    box.innerHTML=`<b>Speicher & Sicherheit</b>
      <div id="premium-storage-text" style="margin-top:4px">Lokaler Speicher wird geprüft…</div>
      <div class="premium-progress"><i id="premium-storage-progress"></i></div>`;
    pane.appendChild(box);

    if(navigator.storage?.estimate){
      navigator.storage.estimate().then(x=>{
        const used=x.usage||0, quota=x.quota||0;
        const pct=quota?Math.min(100,used/quota*100):0;
        const mb=(used/1024/1024).toFixed(1);
        const gb=(quota/1024/1024/1024).toFixed(1);
        document.getElementById('premium-storage-text').textContent =
          `Notarium speichert lokal auf diesem Gerät · ${mb} MB genutzt von ca. ${gb} GB verfügbar.`;
        document.getElementById('premium-storage-progress').style.width=pct+'%';
      }).catch(()=>{});
    }
  }

  /* ---------- Personal accent color, persisted ---------- */
  function addAccentControl(){
    const pane=document.getElementById('pane-themes');
    if(!pane||pane.querySelector('.premium-accent')) return;
    const saved=localStorage.getItem('notarium-premium-accent')||'#D98E2B';
    const box=document.createElement('div');
    box.className='premium-modal-section premium-accent';
    box.innerHTML=`<h4>🎨 Eigene Akzentfarbe</h4>
      <p>Eine eigene Farbe für Buttons, Markierungen und Highlights.</p>
      <div style="display:flex;gap:8px;align-items:center;margin-top:9px">
        <input id="premium-accent-input" type="color" value="${saved}" style="width:38px;height:32px;padding:2px">
        <button class="btn btn-primary" id="premium-accent-apply">Anwenden</button>
        <button class="btn btn-ghost" id="premium-accent-reset">Zurücksetzen</button>
      </div>`;
    pane.appendChild(box);
    box.querySelector('#premium-accent-apply').onclick=()=>{
      const c=box.querySelector('#premium-accent-input').value;
      document.documentElement.style.setProperty('--amber-500',c);
      document.documentElement.style.setProperty('--amber-600',c);
      localStorage.setItem('notarium-premium-accent',c);
      toast('Eigene Akzentfarbe angewendet');
    };
    box.querySelector('#premium-accent-reset').onclick=()=>{
      localStorage.removeItem('notarium-premium-accent');
      if(typeof applyTheme==='function') applyTheme(document.body.dataset.ultimateTheme||'classic',false);
      toast('Akzentfarbe zurückgesetzt');
    };
  }

  /* ---------- Trash button ---------- */
  function addTrashButton(){
    const footer=document.querySelector('.side-footer');
    if(!footer||document.getElementById('premium-trash-button')) return;
    const b=document.createElement('button');
    b.className='icon-btn';b.id='premium-trash-button';b.title='Papierkorb';
    b.style.position='relative';b.innerHTML='🗑️';
    b.onclick=()=>{
      NAV.folderId=null;NAV.notebookId=null;NAV.pageId=null;
      showView('library');renderTrash();renderCrumbs();updateTrashBadge();
    };
    const collapse=document.getElementById('btn-collapse');
    footer.insertBefore(b,collapse||null);
    updateTrashBadge();
  }

  /* ---------- Mobile quick bar ---------- */
  function addMobileActions(){
    if(document.getElementById('premium-mobile-actions')) return;
    const bar=document.createElement('div');
    bar.id='premium-mobile-actions';
    bar.innerHTML=`<button title="Notizbuch">📘</button>
      <button title="Ordner">📁</button>
      <button title="Suche">🔎</button>
      <button title="Extras">✨</button>
      <button title="Papierkorb">🗑️</button>`;
    document.body.appendChild(bar);
    const b=bar.querySelectorAll('button');
    b[0].onclick=()=>openNewNotebookModal();
    b[1].onclick=()=>openNewFolderModal();
    b[2].onclick=()=>document.getElementById('search-input')?.focus();
    b[3].onclick=()=>openUltimateHub();
    b[4].onclick=()=>{showView('library');renderTrash();renderCrumbs()};
  }

  /* ---------- Improve Extras center without replacing its logic ---------- */
  const oldHub=window.openUltimateHub;
  if(typeof oldHub==='function'){
    window.openUltimateHub=function(){
      oldHub();
      setTimeout(()=>{
        addAccentControl();
        enhanceDataPane();
        const modal=document.querySelector('#modal-content .ultimate-modal');
        if(modal) modal.setAttribute('aria-label','Notarium Extras');
      },30);
    };
  }

  /* ---------- Autosave status in topbar ---------- */
  function addTopStatus(){
    const bar=document.querySelector('.topbar');
    if(!bar||document.getElementById('premium-top-status')) return;
    const status=document.createElement('div');
    status.id='premium-top-status';
    status.className='np-status';
    status.innerHTML='<span class="np-dot"></span><span>Bereit</span>';
    const search=document.querySelector('.search-box');
    if(search) search.before(status);
    else bar.appendChild(status);

    const originalSet=window.setSaveIndicator;
    if(typeof originalSet==='function'){
      window.setSaveIndicator=function(text,color){
        originalSet(text,color);
        const dot=status.querySelector('.np-dot'),label=status.querySelector('span:last-child');
        if(dot) dot.style.background=color||'#54a879';
        if(label) label.textContent=text;
      };
    }
  }

  /* ---------- Better keyboard shortcuts ---------- */
  document.addEventListener('keydown',e=>{
    const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&!typing){
      e.preventDefault();
      const s=document.getElementById('search-input');if(s){s.focus();s.select();}
    }
    if(e.key==='Escape'){
      document.querySelector('.premium-trash-actions')?.remove();
      P.trashOpen=false;
    }
  });

  /* ---------- Boot after the existing app has initialized ---------- */
  function boot(){
    if(!window.STATE) return;
    ensureState();
    addDashboard();
    ensureLibraryToolbar();
    addTrashButton();
    addMobileActions();
    addTopStatus();
    updateDashboard();

    const custom=localStorage.getItem('notarium-premium-accent');
    if(custom){
      document.documentElement.style.setProperty('--amber-500',custom);
      document.documentElement.style.setProperty('--amber-600',custom);
    }

    const oldRender=window.renderLibrary;
    if(typeof oldRender==='function'){
      /* Avoid stale dashboard values after every render. */
      const mark=oldRender;
      window.renderLibrary=function(){
        mark();
        updateDashboard();
      };
    }

    updateTrashBadge();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,50));
  else setTimeout(boot,50);
})();
</script>

<script id="notarium-math-studio-js">
(() => {
  const MATH = [
    {id:'coord2d',name:'2D-Koordinatensystem',cat:'Geometrie',desc:'Kartesisches Koordinatensystem mit Achsen und Skalierung.'},
    {id:'coord3d',name:'3D-Koordinatensystem',cat:'Geometrie',desc:'Räumliches Koordinatensystem mit x-, y- und z-Achse.'},
    {id:'vectors',name:'Vektoren',cat:'Algebra',desc:'Vektoren im 2D- und 3D-Raum mit Komponenten.'},
    {id:'triangle',name:'Dreieck',cat:'Geometrie',desc:'Dreieck mit Seiten, Winkeln und Beschriftungen.'},
    {id:'circle',name:'Kreis',cat:'Geometrie',desc:'Radius, Durchmesser, Mittelpunkt und Umfang.'},
    {id:'cube3d',name:'Würfel (3D)',cat:'Geometrie',desc:'3D-Objekt mit Kanten, Flächen und Achsen.'},
    {id:'parabola',name:'Parabel',cat:'Analysis',desc:'Koordinatensystem mit quadratischer Funktion.'},
    {id:'trig',name:'Trigonometrische Funktionen',cat:'Analysis',desc:'Sinus, Cosinus und Tangens im Koordinatensystem.'},
    {id:'numberline',name:'Zahlenstrahl',cat:'Algebra',desc:'Zahlenstrahl mit positiven und negativen Werten.'},
    {id:'matrix',name:'Matrix',cat:'Algebra',desc:'Vorlage für Matrizenrechnung und lineare Algebra.'},
    {id:'probability',name:'Wahrscheinlichkeit',cat:'Statistik',desc:'Baumdiagramm für Wahrscheinlichkeitsaufgaben.'},
    {id:'integral',name:'Integral',cat:'Analysis',desc:'Funktionsgraph mit markierter Fläche unter der Kurve.'},
    {id:'formula',name:'Formelsammlung',cat:'Formeln',desc:'Übersicht für wichtige mathematische Formeln.'},
    {id:'geometry',name:'Geometrische Formen',cat:'Geometrie',desc:'Sammlung grundlegender geometrischer Figuren.'}
  ];
  let selected=MATH[1], filter='Alle', query='';

  const esc=s=>escapeHtml(String(s||''));

  function svg(id){
    const common=`<rect width="800" height="600" fill="#fff"/><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9e0e8" stroke-width="1"/></pattern></defs><rect x="25" y="25" width="750" height="550" fill="url(#g)"/>`;
    const ax=`<g stroke="#26374b" stroke-width="4"><line x1="90" y1="300" x2="710" y2="300"/><line x1="400" y1="530" x2="400" y2="70"/></g><g fill="#26374b" font-family="Arial" font-size="22"><text x="720" y="292">x</text><text x="410" y="62">y</text></g>`;
    if(id==='coord2d') return `<svg viewBox="0 0 800 600">${common}${ax}<g stroke="#6d7887" stroke-width="1.5">${Array.from({length:15},(_,i)=>`<line x1="${100+i*40}" y1="292" x2="${100+i*40}" y2="308"/><line x1="392" y1="${100+i*30}" x2="408" y2="${100+i*30}"/>`).join('')}</g></svg>`;
    if(id==='coord3d') return `<svg viewBox="0 0 800 600">${common}<g stroke-width="7" stroke-linecap="round"><line x1="400" y1="330" x2="670" y2="250" stroke="#38a86b"/><line x1="400" y1="330" x2="205" y2="455" stroke="#e14b4b"/><line x1="400" y1="330" x2="400" y2="75" stroke="#2867c8"/></g><g stroke="#9aa6b5" stroke-width="2" fill="none"><path d="M210 455L480 375L670 250"/><path d="M210 455L210 310L400 225L670 250"/><path d="M400 330L400 225"/></g><g font-family="Arial" font-size="24" font-weight="700"><text x="680" y="245" fill="#38a86b">y</text><text x="180" y="475" fill="#e14b4b">x</text><text x="410" y="68" fill="#2867c8">z</text></g></svg>`;
    if(id==='vectors') return `<svg viewBox="0 0 800 600">${common}${ax}<g stroke="#d94b45" stroke-width="8"><line x1="400" y1="300" x2="610" y2="150"/><path d="M610 150l-28 4 15 20z" fill="#d94b45"/></g><g font-family="Arial" font-size="26" fill="#d94b45"><text x="505" y="205">v⃗</text></g></svg>`;
    if(id==='triangle') return `<svg viewBox="0 0 800 600">${common}<path d="M170 470L400 110L690 470Z" fill="none" stroke="#26374b" stroke-width="6"/><path d="M400 110L400 470" stroke="#8793a3" stroke-width="3" stroke-dasharray="10 8"/><g font-family="Arial" font-size="25" fill="#26374b"><text x="145" y="495">A</text><text x="395" y="90">C</text><text x="695" y="495">B</text><text x="270" y="485">a</text><text x="530" y="485">c</text><text x="420" y="290">h</text></g></svg>`;
    if(id==='circle') return `<svg viewBox="0 0 800 600">${common}<circle cx="400" cy="300" r="180" fill="none" stroke="#26374b" stroke-width="6"/><line x1="400" y1="300" x2="580" y2="300" stroke="#d98e2b" stroke-width="7"/><line x1="220" y1="300" x2="580" y2="300" stroke="#9aa6b5" stroke-width="2" stroke-dasharray="8 8"/><circle cx="400" cy="300" r="7" fill="#d98e2b"/><text x="485" y="285" font-family="Arial" font-size="26" fill="#d98e2b">r</text></svg>`;
    if(id==='cube3d') return `<svg viewBox="0 0 800 600">${common}<g fill="none" stroke="#26374b" stroke-width="5"><path d="M220 400L420 330L610 390L410 465Z"/><path d="M220 400L220 190L420 120L420 330"/><path d="M420 120L610 180L610 390"/><path d="M220 190L410 250L610 180"/><path d="M410 250L410 465"/></g><g stroke-width="6"><line x1="410" y1="330" x2="680" y2="270" stroke="#38a86b"/><line x1="410" y1="330" x2="210" y2="455" stroke="#e14b4b"/><line x1="410" y1="330" x2="410" y2="65" stroke="#2867c8"/></g></svg>`;
    if(id==='parabola') return `<svg viewBox="0 0 800 600">${common}${ax}<path d="M170 100 Q400 500 630 100" fill="none" stroke="#2867c8" stroke-width="7"/><text x="515" y="145" font-family="Arial" font-size="26" fill="#2867c8">f(x)=x²</text></svg>`;
    if(id==='trig') return `<svg viewBox="0 0 800 600">${common}${ax}<path d="M90 300 C140 120 190 480 240 300 S340 120 390 300 S490 480 540 300 S640 120 710 300" fill="none" stroke="#d94b45" stroke-width="5"/><path d="M90 300 C140 480 190 120 240 300 S340 480 390 300 S490 120 540 300 S640 480 710 300" fill="none" stroke="#38a86b" stroke-width="5"/><text x="620" y="125" font-family="Arial" font-size="23" fill="#d94b45">sin(x)</text><text x="620" y="155" font-family="Arial" font-size="23" fill="#38a86b">cos(x)</text></svg>`;
    if(id==='numberline') return `<svg viewBox="0 0 800 600">${common}<line x1="90" y1="300" x2="710" y2="300" stroke="#26374b" stroke-width="6"/><g stroke="#26374b" stroke-width="4" font-family="Arial" font-size="20">${Array.from({length:13},(_,i)=>{let x=110+i*50;return `<line x1="${x}" y1="286" x2="${x}" y2="314"/><text x="${x-7}" y="345">${i-6}</text>`}).join('')}</g></svg>`;
    if(id==='matrix') return `<svg viewBox="0 0 800 600">${common}<text x="150" y="330" font-family="Georgia" font-size="54" fill="#26374b">A =</text><path d="M300 180V420M300 180H650M300 420H650M650 180V420" fill="none" stroke="#26374b" stroke-width="6"/><g font-family="Georgia" font-size="42" fill="#26374b"><text x="360" y="250">1   2   3</text><text x="360" y="315">0   1   4</text><text x="360" y="380">5   6   0</text></g></svg>`;
    if(id==='probability') return `<svg viewBox="0 0 800 600">${common}<g stroke="#26374b" stroke-width="4" fill="none"><path d="M140 300L330 180M140 300L330 420M330 180L560 110M330 180L560 250M330 420L560 350M330 420L560 490"/></g><g font-family="Arial" font-size="24" fill="#26374b"><text x="120" y="290">Start</text><text x="350" y="170">A</text><text x="350" y="415">B</text><text x="575" y="105">A₁</text><text x="575" y="245">A₂</text><text x="575" y="345">B₁</text><text x="575" y="485">B₂</text></g></svg>`;
    if(id==='integral') return `<svg viewBox="0 0 800 600">${common}${ax}<path d="M100 470 Q200 150 300 330 T500 190 T700 420" fill="none" stroke="#2867c8" stroke-width="6"/><path d="M180 300 Q240 210 300 330 T420 240 L420 300Z" fill="#d98e2b" opacity=".28"/><text x="520" y="140" font-family="Georgia" font-size="32" fill="#26374b">∫ f(x) dx</text></svg>`;
    if(id==='formula') return `<svg viewBox="0 0 800 600">${common}<g font-family="Georgia" font-size="30" fill="#26374b"><text x="90" y="115">a² + b² = c²</text><text x="90" y="180">A = πr²</text><text x="90" y="245">U = 2πr</text><text x="90" y="310">y = mx + b</text><text x="90" y="375">x = (−b ± √(b²−4ac)) / 2a</text><text x="90" y="440">P(A) = n(A) / n(Ω)</text></g></svg>`;
    return `<svg viewBox="0 0 800 600">${common}<g fill="none" stroke="#26374b" stroke-width="6"><circle cx="190" cy="190" r="70"/><rect x="330" y="120" width="140" height="140"/><path d="M600 260L520 120L680 120Z"/><rect x="120" y="370" width="140" height="100"/><path d="M350 470L430 370L510 470Z"/></g></svg>`;
  }

  function makeImageData(id){
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg(id));
  }

  function importMathImage(item){
    if(NAV.view!=='editor' || !STATE.pages[EDITOR.pageId]){
      toast('Öffne zuerst eine Seite, um die Vorlage zu importieren.');
      return;
    }
    const src=makeImageData(item.id), img=new Image();
    img.onload=()=>{
      const maxW=Math.min(560,PAGE_W-80), ratio=img.height/img.width;
      const w=maxW,h=Math.min(maxW*ratio,PAGE_H-80);
      const x=(PAGE_W-w)/2,y=(PAGE_H-h)/2;
      const el={id:uid('el'),type:'image',x,y,width:w,height:h,rotation:0,src};
      imgCache.set(src,img);
      STATE.pages[EDITOR.pageId].elements.push(el);
      EDITOR.selectedId=el.id;
      pushHistory();renderCanvas();drawSelectionOverlay();queueSave();
      closeModal();toast(`${item.name} importiert`);
    };
    img.src=src;
  }

  function downloadMathImage(item){
    const a=document.createElement('a');
    a.href=makeImageData(item.id);
    a.download='Notarium-'+item.name.replace(/[^a-z0-9äöüß]+/gi,'-')+'.svg';
    document.body.appendChild(a);a.click();a.remove();
  }

  function renderMathStudio(){
    const cats=['Alle',...new Set(MATH.map(x=>x.cat))];
    const list=MATH.filter(x=>(filter==='Alle'||x.cat===filter)&&(`${x.name} ${x.cat} ${x.desc}`).toLowerCase().includes(query.toLowerCase()));
    openModal(`<div class="modal math-studio">
      <div class="math-head">
        <div class="math-headline"><div class="math-pi">π</div><div><h3>Mathematik</h3><p>Fertige Diagramme, Koordinatensysteme und mathematische Hilfsmittel für deine Notizen.</p></div></div>
        <input class="math-search" id="math-search" placeholder="Mathe-Vorlagen suchen …" value="${esc(query)}">
      </div>
      <div class="math-tabs">${cats.map(c=>`<button class="math-tab ${c===filter?'active':''}" data-math-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="math-body">
        <div class="math-grid">${list.map(x=>`<article class="math-card" data-math-id="${x.id}">
          <button class="math-fav" title="Favorit">♡</button>
          <div class="math-thumb">${svg(x.id)}</div>
          <div class="math-card-body"><span class="math-kind">${esc(x.cat)}</span><b>${esc(x.name)}</b><small>${esc(x.desc)}</small></div>
        </article>`).join('') || `<div style="grid-column:1/-1;padding:50px;text-align:center;color:var(--text-muted)">Keine passende Vorlage gefunden.</div>`}</div>
        <aside class="math-side">
          <div class="math-preview" id="math-preview">${svg(selected.id)}</div>
          <h4 id="math-selected-name">${esc(selected.name)}</h4>
          <p id="math-selected-desc">${esc(selected.desc)}</p>
          <div class="math-checks"><div>Als fertiges Bild importierbar</div><div>Skalierbar auf der Seite</div><div>Für Druck und PDF geeignet</div><div>Ohne externe Dienste erzeugt</div></div>
          <div class="math-actions">
            <button class="btn btn-primary" id="math-import">↓ In Notizbuch importieren</button>
            <button class="btn btn-ghost" id="math-download">⇩ SVG exportieren</button>
          </div>
          <div class="math-related"><b style="font-size:11px">Ähnliche Vorlagen</b>
            ${MATH.filter(x=>x.id!==selected.id).slice(0,5).map(x=>`<button data-math-related="${x.id}">${esc(x.name)} <span style="float:right">›</span></button>`).join('')}
          </div>
        </aside>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" id="math-close">Schließen</button></div>
    </div>`);

    const updateSelected=()=>{
      document.getElementById('math-preview').innerHTML=svg(selected.id);
      document.getElementById('math-selected-name').textContent=selected.name;
      document.getElementById('math-selected-desc').textContent=selected.desc;
      document.querySelectorAll('[data-math-id]').forEach(c=>c.style.outline=c.dataset.mathId===selected.id?'2px solid var(--amber-500)':'none');
    };
    document.querySelectorAll('[data-math-id]').forEach(c=>c.onclick=e=>{
      if(e.target.closest('.math-fav')) return;
      selected=MATH.find(x=>x.id===c.dataset.mathId)||selected;updateSelected();
    });
    document.querySelectorAll('.math-fav').forEach(b=>b.onclick=e=>{
      e.stopPropagation();b.textContent=b.textContent==='♡'?'♥':'♡';
    });
    document.querySelectorAll('[data-math-cat]').forEach(b=>b.onclick=()=>{
      filter=b.dataset.mathCat;renderMathStudio();
    });
    document.querySelectorAll('[data-math-related]').forEach(b=>b.onclick=()=>{
      selected=MATH.find(x=>x.id===b.dataset.mathRelated)||selected;updateSelected();
    });
    document.getElementById('math-search').oninput=e=>{query=e.target.value;renderMathStudio()};
    document.getElementById('math-import').onclick=()=>importMathImage(selected);
    document.getElementById('math-download').onclick=()=>downloadMathImage(selected);
    document.getElementById('math-close').onclick=closeModal;
    updateSelected();
  }

  window.openMathStudio=(id)=>{filter='Alle';query='';selected=MATH.find(x=>x.id===id)||MATH[0];renderMathStudio()};

  /* Expose the math catalogue for the native Extras tab. */
  window.NOTARIUM_MATH=MATH;
  window.openMathPreview=(item)=>{ selected=item; renderMathStudio(); };

})();
</script>

</body>
